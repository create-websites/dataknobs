<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Dataknobs is an AI-native analytics platform that discovers what changed, explains why it matters, and guides investigation with enterprise-grade controls. Stop building dashboards, start making decisions.">
    <meta name="keywords" content="AI analytics, business intelligence, dashboard alternative, data storytelling, automated insights, enterprise analytics, Dataknobs, KPI monitoring, data governance, driver analysis">
    <meta name="author" content="Dataknobs">
    
    <title>Dataknobs | AI-Native Analytics Platform</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Smooth scrolling for anchor links */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-white text-gray-900 selection:bg-indigo-100 selection:text-indigo-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons System ---
        // Replacing lucide-react imports with direct SVG components for standalone HTML compatibility
        const Icon = ({ name, className = "", size = 24, ...props }) => {
            const icons = {
                BarChart3: <path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3" />,
                ShieldCheck: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4" />,
                GitMerge: <><circle cx="18" cy="18" r="3" /><circle cx="6" cy="6" r="3" /><path d="M6 21V9a9 9 0 0 0 9 9" /></>,
                ArrowRight: <path d="M5 12h14M12 5l7 7-7 7" />,
                CheckCircle2: <><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></>,
                Play: <polygon points="5 3 19 12 5 21 5 3" />,
                Menu: <><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="18" y2="18" /></>,
                X: <path d="M18 6 6 18M6 6l12 12" />,
                ChevronDown: <path d="m6 9 6 6 6-6" />,
                ChevronUp: <path d="m18 15-6-6-6 6" />,
                LineChart: <path d="M3 3v18h18M18 17V9l-5 5-5-5-3 3" />,
                BrainCircuit: <><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" /><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" /><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4" /><path d="M17.599 6.5a3 3 0 0 0 .399-1.375" /><path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" /><path d="M3.477 10.896a4 4 0 0 1 .585-.396" /><path d="M19.938 10.5a4 4 0 0 1 .585.396" /><path d="M6 18a4 4 0 0 1-1.97-3.284" /><path d="M17.97 14.716A4 4 0 0 1 18 18" /></>,
                Lock: <><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></>,
                Search: <><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></>,
                Users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></>,
                TrendingUp: <><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></>,
                Activity: <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            };

            return (
                <svg 
                    xmlns="http://www.w3.org/2000/svg" 
                    width={size} 
                    height={size} 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    strokeWidth="2" 
                    strokeLinecap="round" 
                    strokeLinejoin="round" 
                    className={className}
                    {...props}
                >
                    {icons[name] || null}
                </svg>
            );
        };

        // --- Components ---

        const Button = ({ children, variant = 'primary', className = '', ...props }) => {
            const baseStyles = "inline-flex items-center justify-center px-6 py-3 border text-base font-medium rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2";
            const variants = {
                primary: "border-transparent text-white bg-indigo-600 hover:bg-indigo-700 focus:ring-indigo-500",
                secondary: "border-gray-300 text-gray-700 bg-white hover:bg-gray-50 focus:ring-indigo-500",
                outline: "border-indigo-600 text-indigo-600 bg-transparent hover:bg-indigo-50 focus:ring-indigo-500",
                dark: "border-transparent text-white bg-gray-900 hover:bg-gray-800 focus:ring-gray-900"
            };

            return (
                <button className={`${baseStyles} ${variants[variant]} ${className}`} {...props}>
                    {children}
                </button>
            );
        };

        const SectionHeading = ({ badge, title, subtitle, centered = true }) => (
            <div className={`mb-12 ${centered ? 'text-center' : ''}`}>
                {badge && (
                    <span className="inline-block px-3 py-1 mb-4 text-xs font-semibold tracking-wider text-indigo-600 uppercase bg-indigo-50 rounded-full">
                        {badge}
                    </span>
                )}
                <h2 className="text-3xl font-bold tracking-tight text-gray-900 sm:text-4xl mb-4">
                    {title}
                </h2>
                {subtitle && (
                    <p className="max-w-2xl mx-auto text-xl text-gray-500">
                        {subtitle}
                    </p>
                )}
            </div>
        );

        const FeatureCard = ({ iconName, title, description, benefits = [] }) => (
            <div className="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                <div className="inline-flex items-center justify-center w-12 h-12 mb-6 rounded-lg bg-indigo-50 text-indigo-600">
                    <Icon name={iconName} className="w-6 h-6" />
                </div>
                <h3 className="text-xl font-bold text-gray-900 mb-3">{title}</h3>
                <p className="text-gray-600 mb-6">{description}</p>
                {benefits.length > 0 && (
                    <ul className="space-y-3">
                        {benefits.map((benefit, index) => (
                            <li key={index} className="flex items-start text-sm text-gray-600">
                                <Icon name="CheckCircle2" className="w-5 h-5 text-green-500 mr-2 flex-shrink-0" />
                                <span>{benefit}</span>
                            </li>
                        ))}
                    </ul>
                )}
            </div>
        );

        const AccordionItem = ({ question, answer, isOpen, onClick }) => (
            <div className="border-b border-gray-200">
                <button
                    className="flex items-center justify-between w-full py-6 text-left focus:outline-none"
                    onClick={onClick}
                >
                    <span className="text-lg font-medium text-gray-900">{question}</span>
                    {isOpen ? (
                        <Icon name="ChevronUp" className="w-5 h-5 text-indigo-600" />
                    ) : (
                        <Icon name="ChevronDown" className="w-5 h-5 text-gray-400" />
                    )}
                </button>
                <div
                    className={`overflow-hidden transition-all duration-300 ease-in-out ${
                        isOpen ? 'max-h-96 opacity-100 pb-6' : 'max-h-0 opacity-0'
                    }`}
                >
                    <p className="text-gray-600">{answer}</p>
                </div>
            </div>
        );

        const App = () => {
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [openFaqIndex, setOpenFaqIndex] = useState(0);

            const toggleFaq = (index) => {
                setOpenFaqIndex(openFaqIndex === index ? -1 : index);
            };

            const scrollToSection = (id) => {
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                    setMobileMenuOpen(false);
                }
            };

            return (
                <div className="min-h-screen bg-white">
                    
                    {/* --- Navigation --- */}
                    <header className="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between items-center h-16">
                                <div className="flex items-center cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                                    <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center mr-2">
                                        <Icon name="BarChart3" className="text-white w-5 h-5" />
                                    </div>
                                    <span className="text-xl font-bold tracking-tight text-gray-900">Dataknobs</span>
                                </div>
                                
                                <nav className="hidden md:flex space-x-8">
                                    <button onClick={() => scrollToSection('problem')} className="text-gray-600 hover:text-indigo-600 font-medium">Why Dataknobs</button>
                                    <button onClick={() => scrollToSection('platform')} className="text-gray-600 hover:text-indigo-600 font-medium">Platform</button>
                                    <button onClick={() => scrollToSection('how-it-works')} className="text-gray-600 hover:text-indigo-600 font-medium">How it Works</button>
                                    <button onClick={() => scrollToSection('faq')} className="text-gray-600 hover:text-indigo-600 font-medium">FAQ</button>
                                </nav>
                                
                                <div className="hidden md:flex items-center space-x-4">
                                    <button className="text-gray-900 hover:text-indigo-600 font-medium">Login</button>
                                    <Button onClick={() => scrollToSection('cta')} variant="primary" className="py-2 px-4 text-sm">
                                        Request Access
                                    </Button>
                                </div>

                                <div className="md:hidden">
                                    <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="text-gray-600 p-2">
                                        {mobileMenuOpen ? <Icon name="X" size={24} /> : <Icon name="Menu" size={24} />}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Mobile Menu */}
                        {mobileMenuOpen && (
                            <div className="md:hidden bg-white border-b border-gray-100 px-4 py-4 space-y-4 shadow-lg">
                                <button onClick={() => scrollToSection('problem')} className="block w-full text-left py-2 font-medium text-gray-600">Why Dataknobs</button>
                                <button onClick={() => scrollToSection('platform')} className="block w-full text-left py-2 font-medium text-gray-600">Platform</button>
                                <button onClick={() => scrollToSection('how-it-works')} className="block w-full text-left py-2 font-medium text-gray-600">How it Works</button>
                                <button onClick={() => scrollToSection('cta')} className="block w-full text-left py-2 font-medium text-indigo-600">Request Access</button>
                            </div>
                        )}
                    </header>

                    {/* --- Hero Section --- */}
                    <section className="relative pt-32 pb-20 lg:pt-40 lg:pb-28 overflow-hidden">
                        <div className="absolute inset-0 -z-10 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-50 via-white to-white"></div>
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                            <h1 className="text-5xl md:text-6xl font-extrabold tracking-tight text-gray-900 mb-6">
                                Stop building dashboards. <br className="hidden md:block" />
                                <span className="text-indigo-600">Start making decisions.</span>
                            </h1>
                            <p className="mt-4 max-w-2xl mx-auto text-xl text-gray-500 mb-10">
                                Dataknobs is an AI-native analytics platform that discovers what changed, explains why it matters, and guides investigation—with enterprise-grade controls.
                            </p>
                            <div className="flex flex-col sm:flex-row justify-center gap-4 mb-8">
                                <Button variant="primary">
                                    Request Early Access
                                    <span className="ml-2"><Icon name="ArrowRight" size={16} /></span>
                                </Button>
                                <Button variant="secondary">
                                    <span className="mr-2 text-indigo-600"><Icon name="Play" size={16} /></span>
                                    Book a 20-min Demo
                                </Button>
                            </div>
                            <p className="text-sm text-gray-500 flex items-center justify-center gap-2">
                                <Icon name="CheckCircle2" className="w-4 h-4 text-green-500" />
                                Works with your warehouse and existing BI; no rip-and-replace required.
                            </p>
                        </div>
                    </section>

                    {/* --- Social Proof Banner --- */}
                    <div className="bg-gray-900 text-white py-4">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-center sm:justify-between text-center sm:text-left gap-4">
                            <div>
                                <span className="font-bold text-indigo-400 mr-2">Design Partners Wanted:</span>
                                <span className="text-gray-300 text-sm">We’re onboarding a limited number of teams to shape the product.</span>
                            </div>
                            <div className="flex gap-4 text-xs font-medium uppercase tracking-wide text-gray-400">
                                <span>White-glove setup</span>
                                <span>•</span>
                                <span>Priority Roadmap</span>
                                <span>•</span>
                                <span>Early Pricing</span>
                            </div>
                        </div>
                    </div>

                    {/* --- Problem Section --- */}
                    <section id="problem" className="py-20 bg-white">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <SectionHeading 
                                badge="The Problem"
                                title="Dashboards don't answer questions"
                                subtitle="Most BI stacks are optimized for building reports, not finding answers."
                            />
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {[
                                    { title: "Analyst Burnout", desc: "Analysts spend weeks creating and maintaining static dashboards.", icon: "Activity" },
                                    { title: "Executive Overload", desc: "Executives get 50 charts and still have to ask 'So what?'", icon: "LineChart" },
                                    { title: "Metric Chaos", desc: "Teams argue about metric definitions and data access permissions.", icon: "Users" },
                                    { title: "Ungoverned AI", desc: "'Copilot' chat tools generate outputs without the governance enterprises need.", icon: "BrainCircuit" }
                                ].map((item, i) => (
                                    <div key={i} className="p-6 bg-gray-50 rounded-xl border border-gray-100">
                                        <div className="mb-4 text-red-500">
                                            <Icon name={item.icon} size={32} />
                                        </div>
                                        <h3 className="font-bold text-lg mb-2">{item.title}</h3>
                                        <p className="text-gray-600 text-sm">{item.desc}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* --- Platform / Value Prop --- */}
                    <section id="platform" className="py-20 bg-gray-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <SectionHeading 
                                badge="The Dataknobs Platform"
                                title="Reasoning + Controls"
                                subtitle="Dataknobs replaces manual analytics workflows with three core pillars."
                            />

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                {/* Pillar 1: Kreate */}
                                <FeatureCard 
                                    iconName="TrendingUp"
                                    title="Kreate: Insight & Storytelling"
                                    description="Automatically generates the right insight experience. Tailors output to the audience (Exec vs Analyst)."
                                    benefits={[
                                        "Detects anomalies, trends, and change points",
                                        "Generates narratives and supporting visuals",
                                        "Natural language questions to governed visuals"
                                    ]}
                                />

                                {/* Pillar 2: Kontrols */}
                                <FeatureCard 
                                    iconName="ShieldCheck"
                                    title="Kontrols: Governance & Safety"
                                    description="Keeps AI outputs correct, explainable, and auditable. AI only uses approved metrics."
                                    benefits={[
                                        "Semantic layer enforcement",
                                        "Role-based data access (Row/Column)",
                                        "Explainable audit trails for every insight"
                                    ]}
                                />

                                {/* Pillar 3: Knobs */}
                                <FeatureCard 
                                    iconName="GitMerge"
                                    title="Knobs: Guided Diagnosis"
                                    description="Guides root cause exploration and diagnostic workflows. System recommends the next breakdown."
                                    benefits={[
                                        "Guided drill paths for deeper analysis",
                                        "Ranked driver analysis with stats validation",
                                        "Human-in-the-loop feedback loops"
                                    ]}
                                />
                            </div>
                        </div>
                    </section>

                    {/* --- Differentiation --- */}
                    <section className="py-20 bg-white">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="bg-indigo-900 rounded-3xl p-8 md:p-12 shadow-2xl overflow-hidden relative">
                                {/* Background decoration */}
                                <div className="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 bg-indigo-700 rounded-full opacity-20 blur-3xl"></div>
                                
                                <div className="relative z-10 text-white">
                                    <h2 className="text-3xl font-bold mb-8 text-center">Why Dataknobs is different</h2>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-center md:text-left">
                                        <div className="bg-indigo-800/50 p-6 rounded-xl border border-indigo-700 backdrop-blur-sm">
                                            <h3 className="font-bold text-lg text-indigo-200 mb-2">Traditional BI</h3>
                                            <p className="text-indigo-100 text-sm mb-4">Tableau / Power BI</p>
                                            <p className="text-sm text-gray-300">Great at dashboards, but weak at autonomous insights. Requires heavy manual lifting.</p>
                                        </div>

                                        <div className="bg-indigo-800/50 p-6 rounded-xl border border-indigo-700 backdrop-blur-sm">
                                            <h3 className="font-bold text-lg text-indigo-200 mb-2">AI Copilots</h3>
                                            <p className="text-indigo-100 text-sm mb-4">Chat-based tools</p>
                                            <p className="text-sm text-gray-300">Good at chatting, but weak at governance, rigor, and enterprise repeatability.</p>
                                        </div>

                                        <div className="bg-white text-gray-900 p-6 rounded-xl border border-white shadow-lg transform md:-translate-y-2">
                                            <div className="absolute top-0 right-0 bg-green-500 text-white text-xs font-bold px-2 py-1 rounded-bl-lg rounded-tr-lg">WINNER</div>
                                            <h3 className="font-bold text-lg text-indigo-600 mb-2">Dataknobs</h3>
                                            <p className="text-gray-500 text-sm mb-4">The Complete Platform</p>
                                            <p className="text-sm">Combines autonomous insights (Kreate), enterprise-grade trust (Kontrols), and guided investigation (Knobs).</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* --- How It Works --- */}
                    <section id="how-it-works" className="py-20 bg-gray-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <SectionHeading 
                                title="From data to decision"
                                subtitle="A simple workflow to get you out of dashboard hell."
                            />
                            
                            <div className="relative">
                                {/* Connector Line (Desktop) */}
                                <div className="hidden md:block absolute top-1/2 left-0 w-full h-1 bg-gray-200 -translate-y-1/2 z-0"></div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-8 relative z-10">
                                    {[
                                        { step: "01", title: "Connect", desc: "Link to your warehouse (Snowflake, BigQuery, etc).", icon: "Lock" },
                                        { step: "02", title: "Define", desc: "Set metrics once in Kontrols or import definitions.", icon: "Activity" },
                                        { step: "03", title: "Discover", desc: "Kreate surfaces top changes and insights automatically.", icon: "Search" },
                                        { step: "04", title: "Diagnose", desc: "Use Knobs to explore drivers and drill down.", icon: "GitMerge" }
                                    ].map((item, i) => (
                                        <div key={i} className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 text-center md:text-left">
                                            <div className="text-4xl font-black text-indigo-100 mb-4">{item.step}</div>
                                            <h3 className="text-xl font-bold mb-2 flex items-center justify-center md:justify-start gap-2">
                                                {item.title}
                                            </h3>
                                            <p className="text-gray-600 text-sm">{item.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* --- Ideal Customers --- */}
                    <section className="py-20 bg-white border-t border-gray-100">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                                <div>
                                    <h2 className="text-3xl font-bold mb-6">Who is this for?</h2>
                                    <div className="space-y-6">
                                        {[
                                            "Growth & Product teams shipping weekly updates",
                                            "Revenue teams tracking churn, pipeline, and retention",
                                            "Operations teams monitoring SLA, throughput, and cost",
                                            "Data teams overwhelmed by ad-hoc requests"
                                        ].map((item, i) => (
                                            <div key={i} className="flex items-center">
                                                <div className="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center mr-4 flex-shrink-0">
                                                    <Icon name="Users" className="w-5 h-5 text-indigo-600" />
                                                </div>
                                                <span className="text-gray-700 font-medium">{item}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="bg-gray-50 p-8 rounded-2xl border border-gray-100">
                                    <h3 className="font-bold text-xl mb-4">Great first use cases</h3>
                                    <ul className="space-y-3">
                                        <li className="flex items-start">
                                            <Icon name="CheckCircle2" className="w-5 h-5 text-indigo-600 mr-2 mt-0.5" />
                                            <span className="text-gray-600">Weekly business review automation ("what changed since last week?")</span>
                                        </li>
                                        <li className="flex items-start">
                                            <Icon name="CheckCircle2" className="w-5 h-5 text-indigo-600 mr-2 mt-0.5" />
                                            <span className="text-gray-600">KPI anomaly detection with explanation</span>
                                        </li>
                                        <li className="flex items-start">
                                            <Icon name="CheckCircle2" className="w-5 h-5 text-indigo-600 mr-2 mt-0.5" />
                                            <span className="text-gray-600">Funnel movement and driver analysis</span>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* --- Trust & Security --- */}
                    <section className="py-16 bg-gray-50 text-center">
                        <div className="max-w-4xl mx-auto px-4">
                            <div className="flex justify-center mb-4">
                                <Icon name="ShieldCheck" className="w-12 h-12 text-indigo-600" />
                            </div>
                            <h2 className="text-2xl font-bold mb-4">Built for Real-World Constraints</h2>
                            <p className="text-gray-600 mb-8">
                                We know enterprise data. Dataknobs works with governed metric definitions, 
                                respects permission-aware outputs by default, and provides full query transparency 
                                and audit trails.
                            </p>
                        </div>
                    </section>

                    {/* --- FAQ --- */}
                    <section id="faq" className="py-20 bg-white">
                        <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
                            <SectionHeading title="Frequently Asked Questions" centered={true} />
                            
                            <div className="space-y-1">
                                <AccordionItem 
                                    question="Do we need to replace Tableau/Power BI?"
                                    answer="No. Dataknobs can sit above your warehouse and complement your BI stack. Many teams start by using Dataknobs for insights and diagnosis, while keeping BI for distribution."
                                    isOpen={openFaqIndex === 0}
