<!-- Slideshow JavaScript Logic (Re-implemented for the new structure) -->
<script>
        let slideIndex = 0;
        const slideInterval = 5000; // Change image every 5 seconds

        function showSlides() {
            let i;
            let slides = document.getElementsByClassName("mySlides");
            let dots = document.getElementsByClassName("dot");

            if (slides.length === 0) return;

            // Hide all slides
            for (i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
            }
            
            // Increment index, looping back to 0
            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1 }

            // De-activate all dots
            for (i = 0; i < dots.length; i++) {
                dots[i].classList.remove("bg-indigo-500");
                dots[i].classList.add("bg-gray-400");
            }

            // Show the current slide and activate the current dot
            slides[slideIndex - 1].style.display = "block";
            dots[slideIndex - 1].classList.remove("bg-gray-400");
            dots[slideIndex - 1].classList.add("bg-indigo-500");

            // Restart the auto-play loop
            setTimeout(showSlides, slideInterval); 
        }

        // Thumbnail image controls (for manual clicks on dots)
        function currentSlide(n) {
            slideIndex = n - 1; // n is 1-based, slideIndex is used 0-based in the function above
            
            // Manually trigger the transition immediately when a dot is clicked
            let slides = document.getElementsByClassName("mySlides");
            let dots = document.getElementsByClassName("dot");

            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
                dots[i].classList.remove("bg-indigo-500");
                dots[i].classList.add("bg-gray-400");
            }

            // Ensure index is valid before showing
            if (slideIndex >= 0 && slideIndex < slides.length) {
                slides[slideIndex].style.display = "block";
                dots[slideIndex].classList.remove("bg-gray-400");
                dots[slideIndex].classList.add("bg-indigo-500");
            }
        }

        // Start the slideshow after the page loads
        window.onload = showSlides;

    </script>
